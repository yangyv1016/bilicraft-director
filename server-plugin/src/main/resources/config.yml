# 兼容旧版：仅在 worlds.yml 首次不存在时导入该实际已加载世界及下方配置。
# worlds.yml 一旦生成即为权威名单；之后请用 /director worlds list/add/remove 管理世界。
# 支持主世界、下界、末地和自定义世界，不自动加载世界或跨世界传送。
world-name: world

# 所有高度均排除，边界也包含在内。此阶段不提供传送功能。
# exclude-regions:
#   - min-x: 100
#     max-x: 200
#     min-z: -50
#     max-z: 50
exclude-regions: []

# 管理员填写真实取景点/区域；不提供虚构坐标。本文件场景只随旧 world-name 首次导入。
# 多世界独立场景和排除区在生成的 worlds.yml 中配置，以真实世界 UUID 关联。
# 每项必须包含 id/name/kind/x/y/z/radius，kind 为 viewpoint（环绕）或 area（区域慢游）。
# x/y/z 为取景中心；客户端机位在 y+4，radius 为水平路径半径（6～48 格）。
# 中心±半径的包围矩形不能接触排除区或世界边界，y 须为 minHeight～maxHeight-5。
# id 唯一且最多 64 UTF-8 字节，name 最多 256 UTF-8 字节；最多配置 64 项。
# 仅返回附近且路径涉及区块已加载的场景，不为候选强制加载区块。
scenes: []

# 本阶段不采集热力图；后续模块将基于玩家活动和建造事件增量聚合。
